name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (Rust)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bowline_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bowline_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-0123456789abcdef0123456789abcdef
      INTERNAL_SERVICE_TOKEN: ci-internal
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - name: fmt
        run: cargo fmt --all --check
        working-directory: api
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: api
      - name: test
        run: cargo test --all-targets
        working-directory: api

  web:
    name: web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The lockfile is written by npm 11, which resolves the platform specific
      # optional dependencies differently from the npm 10 that ships with Node 22.
      # Pin it so `npm ci` sees the same tree the lockfile describes, and so CI
      # matches web/Dockerfile.
      - run: npm install -g npm@11.6.2
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test -- --run
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  billing:
    name: billing (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: billing/pom.xml
      - run: ./mvnw -B -q verify
        working-directory: billing

  analytics:
    name: analytics (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: analytics
      - run: ruff check . && ruff format --check .
        working-directory: analytics
      - run: python -m analytics.train --quick
        working-directory: analytics
      - run: python -m pytest -q
        working-directory: analytics

  tools:
    name: tools (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - run: gofmt -l . | tee /dev/stderr | wc -l | grep -q '^0$'
        working-directory: tools
      - run: go vet ./...
        working-directory: tools
      - run: go test ./...
        working-directory: tools

  db:
    name: db (migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bowline
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - name: apply every migration twice (second run must be a no-op for reference data)
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          for f in db/migrations/*.sql; do
            psql -h localhost -U postgres -d bowline -v ON_ERROR_STOP=1 -q --single-transaction -f "$f"
          done
          psql -h localhost -U postgres -d bowline -v ON_ERROR_STOP=1 -q --single-transaction -f db/migrations/0008_reference_data.sql
          psql -h localhost -U postgres -d bowline -v ON_ERROR_STOP=1 -q -f db/tests/integrity.sql

  terraform:
    name: infra (Terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - name: validate every module and environment
        working-directory: infra/terraform
        run: |
          for d in modules/* environments/*; do
            echo "== $d"; (cd "$d" && terraform init -backend=false -input=false >/dev/null && terraform validate)
          done

  leaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: nothing published that should not be
        run: ./scripts/leak_scan.sh
      - name: full history, in case something was committed and later removed
        # The tool rather than gitleaks-action: the action always tries to upload a
        # SARIF file that it only writes when it finds something, so a clean scan
        # failed the job on a missing artifact. `git log -p` covers every commit,
        # which a working tree scan cannot.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.0 detect \
              --source=/repo \
              --config=/repo/.gitleaks.toml \
              --redact --no-banner --verbose

  security:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - name: cargo audit
        # Two advisories are recorded in Cargo.lock but are not compiled into
        # anything. `cargo audit` reads the lockfile, which lists optional
        # dependencies the build never enables, so both are unreachable here:
        #   RUSTSEC-2023-0071  rsa, reached only through sqlx-mysql. This service
        #                      is PostgreSQL only (sqlx has default-features off
        #                      and just the postgres driver), and the advisory has
        #                      no fixed release. `cargo tree` shows zero matches.
        #   RUSTSEC-2026-0235  rkyv, an optional feature of rust_decimal that is
        #                      not enabled. Also zero matches in the tree.
        # Everything else, including yanked crates, still fails the build.
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit --deny warnings \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0235
        working-directory: api
      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: web
      - name: pip-audit
        run: |
          pip install pip-audit==2.9.0
          pip-audit -r requirements.txt -r requirements-dev.txt
        working-directory: analytics
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)"/bin/govulncheck ./...
        working-directory: tools

  docker:
    name: docker images
    runs-on: ubuntu-latest
    needs: [api, web, billing, analytics, tools]
    strategy:
      # One image failing should not hide the state of the other five.
      fail-fast: false
      matrix:
        include:
          - { name: api,       context: .,         file: api/Dockerfile,       target: "" }
          - { name: web,       context: web,       file: web/Dockerfile,       target: "" }
          - { name: billing,   context: billing,   file: billing/Dockerfile,   target: "" }
          - { name: analytics, context: analytics, file: analytics/Dockerfile, target: "" }
          - { name: notify,    context: tools,     file: tools/Dockerfile,     target: notify }
          - { name: bowctl,    context: tools,     file: tools/Dockerfile,     target: bowctl }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: bowline/${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bowline/${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
