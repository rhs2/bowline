name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (Rust)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bowline_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bowline_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-0123456789abcdef0123456789abcdef
      INTERNAL_SERVICE_TOKEN: ci-internal
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - name: fmt
        run: cargo fmt --all --check
        working-directory: api
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: api
      - name: test
        run: cargo test --all-targets
        working-directory: api

  web:
    name: web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test -- --run
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  billing:
    name: billing (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: billing/pom.xml
      - run: ./mvnw -B -q verify
        working-directory: billing

  analytics:
    name: analytics (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: analytics
      - run: ruff check . && ruff format --check .
        working-directory: analytics
      - run: python -m analytics.train --quick
        working-directory: analytics
      - run: python -m pytest -q
        working-directory: analytics

  tools:
    name: tools (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - run: gofmt -l . | tee /dev/stderr | wc -l | grep -q '^0$'
        working-directory: tools
      - run: go vet ./...
        working-directory: tools
      - run: go test ./...
        working-directory: tools

  db:
    name: db (migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bowline
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: apply every migration twice (second run must be a no-op for reference data)
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          for f in db/migrations/*.sql; do
            psql -h localhost -U postgres -d bowline -v ON_ERROR_STOP=1 -q --single-transaction -f "$f"
          done
          psql -h localhost -U postgres -d bowline -v ON_ERROR_STOP=1 -q --single-transaction -f db/migrations/0008_reference_data.sql
          psql -h localhost -U postgres -d bowline -v ON_ERROR_STOP=1 -q -f db/tests/integrity.sql

  terraform:
    name: infra (Terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - name: validate every module and environment
        working-directory: infra/terraform
        run: |
          for d in modules/* environments/*; do
            echo "== $d"; (cd "$d" && terraform init -backend=false -input=false >/dev/null && terraform validate)
          done

  leaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: nothing published that should not be
        run: ./scripts/leak_scan.sh
      - name: full history, in case something was committed and later removed
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit --deny warnings
        working-directory: api
      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: web
      - name: pip-audit
        run: |
          pip install pip-audit==2.9.0
          pip-audit -r requirements.txt -r requirements-dev.txt
        working-directory: analytics
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)"/bin/govulncheck ./...
        working-directory: tools

  docker:
    name: docker images
    runs-on: ubuntu-latest
    needs: [api, web, billing, analytics, tools]
    strategy:
      matrix:
        include:
          - { name: api,       context: .,         file: api/Dockerfile,       target: "" }
          - { name: web,       context: web,       file: web/Dockerfile,       target: "" }
          - { name: billing,   context: billing,   file: billing/Dockerfile,   target: "" }
          - { name: analytics, context: analytics, file: analytics/Dockerfile, target: "" }
          - { name: notify,    context: tools,     file: tools/Dockerfile,     target: notify }
          - { name: bowctl,    context: tools,     file: tools/Dockerfile,     target: bowctl }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: bowline/${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: bowline/${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
