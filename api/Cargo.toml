[package]
name = "bowline-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Bowline core service: identity, organisation, HR, operations, finance, communications, support and audit"
license = "MIT"
publish = false
default-run = "bowline-api"

[lib]
name = "bowline_api"
path = "src/lib.rs"

[[bin]]
name = "bowline-api"
path = "src/main.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[[bin]]
name = "backfill-documents"
path = "src/bin/backfill_documents.rs"

[dependencies]
axum = { version = "0.7.9", features = ["macros"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["trace", "cors", "request-id", "timeout", "compression-gzip", "set-header", "catch-panic", "util"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "rust_decimal", "json", "migrate", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
rust_decimal = { version = "1.42.1", features = ["serde"] }
argon2 = "0.5.3"
jsonwebtoken = "9.3.1"
rand = "0.8.8"
sha2 = "0.10.9"
hex = "0.4.3"
validator = { version = "0.20.0", features = ["derive"] }
thiserror = "2.0.20"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid", "decimal"] }
utoipa-scalar = { version = "0.2.0", features = ["axum"] }
axum-prometheus = "0.10.1"
metrics = "0.23.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
aws-sdk-s3 = { version = "1.144.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "http-1x"] }
aws-config = { version = "1.11.0", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
redis = { version = "0.27.6", default-features = false, features = ["tokio-comp", "connection-manager"] }
dotenvy = "0.15.7"

[profile.dev]
debug = "line-tables-only"

# Dependencies are compiled without debug info and with light optimisation so the
# target directory stays small and Argon2id stays fast in tests.
[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
